# Perfil local: usa H2 en memoria y desactiva la validación JWT
spring:
  datasource:
    url: jdbc:h2:mem:twitterdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          # URI ficticia – el decoder no se usa porque security-local sobreescribe la config
          issuer-uri: https://local.dev/
          audiences: local-audience

auth0:
  domain: local.dev
  audience: local-audience
