spring:
  datasource:
    url: jdbc:h2:mem:twitterdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://local.dev/
          audiences: local-audience

auth0:
  domain: local.dev
  audience: local-audience
