server:
  port: 8080

spring:
  application:
    name: twitter-monolith

  datasource:
    url: jdbc:h2:mem:twitterdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          # Replace YOUR-AUTH0-DOMAIN with your actual Auth0 domain, e.g. dev-xxxx.us.auth0.com
          issuer-uri: https://${AUTH0_DOMAIN:YOUR-AUTH0-DOMAIN}/
          audiences: ${AUTH0_AUDIENCE:https://twitter-monolith-api}

# Auth0 configuration (used for custom audience validation)
auth0:
  domain: ${AUTH0_DOMAIN:YOUR-AUTH0-DOMAIN}
  audience: ${AUTH0_AUDIENCE:https://twitter-monolith-api}

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: ${AUTH0_CLIENT_ID:YOUR-SPA-CLIENT-ID}
      additional-query-string-params:
        audience: ${AUTH0_AUDIENCE:https://twitter-monolith-api}

logging:
  level:
    org.springframework.security: DEBUG
    com.twitter.monolith: DEBUG
